<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>Concept 4 — Spotlight Reveal: The Agent Is Watching</title>
  <desc>A radial spotlight follows the cursor across a dark fixed layer, revealing a hidden T3rnel architecture blueprint that swaps per section; corner robot eyes also track the cursor.</desc>
  <defs>
    <radialGradient id="spotG4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="62%" stop-color="#9be8c4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050807" stop-opacity="1"/>
    </radialGradient>
    <mask id="spotMask4">
      <rect width="1280" height="820" fill="#000"/>
      <circle cx="520" cy="430" r="210" fill="#fff"/>
    </mask>
    <radialGradient id="eyeG4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9be8c4"/><stop offset="70%" stop-color="#19a866"/><stop offset="100%" stop-color="#064a2c"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw  ·  section: Agent Tools (blueprint revealed)</text>

  <!-- dark fixed layer -->
  <rect x="0" y="34" width="1280" height="786" fill="#070a08"/>

  <!-- hidden blueprint (architecture of T3rnel agent loop) drawn faintly; revealed inside spotlight -->
  <g stroke="#19a866" stroke-opacity="0.55" fill="none" stroke-width="1.4">
    <!-- agent loop ring -->
    <circle cx="520" cy="430" r="120"/>
    <circle cx="520" cy="430" r="70"/>
    <!-- nodes around loop -->
    <circle cx="520" cy="310" r="10" fill="#19a866"/>
    <circle cx="624" cy="370" r="10" fill="#19a866"/>
    <circle cx="624" cy="490" r="10" fill="#19a866"/>
    <circle cx="520" cy="550" r="10" fill="#19a866"/>
    <circle cx="416" cy="490" r="10" fill="#19a866"/>
    <circle cx="416" cy="370" r="10" fill="#19a866"/>
    <!-- spokes -->
    <line x1="520" y1="430" x2="520" y2="310"/><line x1="520" y1="430" x2="624" y2="370"/>
    <line x1="520" y1="430" x2="624" y2="490"/><line x1="520" y1="430" x2="520" y2="550"/>
    <line x1="520" y1="430" x2="416" y2="490"/><line x1="520" y1="430" x2="416" y2="370"/>
    <!-- external connections: MCP bridge + browser -->
    <line x1="624" y1="370" x2="780" y2="300"/><rect x="780" y="284" width="120" height="32" rx="6" fill="#0e1310" stroke="#19a866"/>
    <line x1="624" y1="490" x2="780" y2="560"/><rect x="780" y="544" width="120" height="32" rx="6" fill="#0e1310" stroke="#19a866"/>
    <line x1="416" y1="370" x2="260" y2="300"/><rect x="140" y="284" width="120" height="32" rx="6" fill="#0e1310" stroke="#19a866"/>
    <line x1="416" y1="490" x2="260" y2="560"/><rect x="140" y="544" width="120" height="32" rx="6" fill="#0e1310" stroke="#19a866"/>
  </g>
  <g fill="#9be8c4" font-size="10">
    <text x="520" y="296" text-anchor="middle">PLAN</text>
    <text x="638" y="366" text-anchor="middle">ACT</text>
    <text x="638" y="494" text-anchor="middle">OBSERVE</text>
    <text x="520" y="572" text-anchor="middle">APPROVE</text>
    <text x="402" y="494" text-anchor="middle">VERIFY</text>
    <text x="402" y="366" text-anchor="middle">RECALL</text>
    <text x="840" y="304" text-anchor="middle">MCP Bridge</text>
    <text x="840" y="564" text-anchor="middle">T3rnel Browser</text>
    <text x="200" y="304" text-anchor="middle">Memory</text>
    <text x="200" y="564" text-anchor="middle">Skills</text>
    <text x="520" y="434" text-anchor="middle" font-size="13" font-weight="700">AGENT LOOP</text>
  </g>

  <!-- spotlight overlay (darkens everything outside the cursor circle) -->
  <rect x="0" y="34" width="1280" height="786" fill="url(#spotG4)"/>

  <!-- header -->
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.6"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#ffffff"/>
  <text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text>
  <text x="70" y="68" fill="#ffffff" font-size="14" font-weight="800">T3raTech</text>

  <!-- hero text (visible, bright) -->
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#ffffff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">Move your cursor to reveal the architecture beneath.</text>

  <!-- corner robot: just eyes that track cursor (top-right) -->
  <g transform="translate(1120,150)">
    <rect x="0" y="0" width="120" height="70" rx="16" fill="#0e1310" stroke="#3a423d"/>
    <circle cx="34" cy="35" r="14" fill="#050807"/>
    <circle cx="86" cy="35" r="14" fill="#050807"/>
    <!-- pupils track cursor at 520,430 -> down-left from eyes -->
    <circle cx="28" cy="42" r="6" fill="url(#eyeG4)"/>
    <circle cx="80" cy="42" r="6" fill="url(#eyeG4)"/>
    <text x="60" y="92" fill="#5f655f" font-size="8" text-anchor="middle">T3ra is watching</text>
  </g>

  <!-- cursor -->
  <g transform="translate(520,430)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#ffffff" stroke="#0a0d0b" stroke-width="1"/></g>
  <circle cx="520" cy="430" r="210" fill="none" stroke="#19a866" stroke-opacity="0.3" stroke-dasharray="3 6"/>

  <rect x="0" y="794" width="1280" height="26" fill="#111111"/>
  <text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 4 — Spotlight Reveal: cursor uncovers a hidden per-section blueprint; corner robot eyes track the mouse</text>
</svg>
