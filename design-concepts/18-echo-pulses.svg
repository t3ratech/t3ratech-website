<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>18 — Echo Pulses</title>
  <defs><radialGradient id="bg18" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a1410"/><stop offset="100%" stop-color="#050807"/></radialGradient></defs>
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · section: Home (values &amp; mission fragments)</text>
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg18)"/>
  <!-- echo rings from cursor at 640,400 -->
  <g fill="none" stroke="#19a866">
    <circle cx="640" cy="400" r="80" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="640" cy="400" r="150" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="640" cy="400" r="230" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <!-- revealed text fragments inside rings -->
  <g fill="#9be8c4" font-size="14" font-weight="700" text-anchor="middle" opacity="0.9">
    <text x="640" y="360">Patriotism</text>
    <text x="560" y="430">Excellence</text>
    <text x="720" y="430">Innovation</text>
    <text x="640" y="470">Partnership</text>
  </g>
  <!-- dim fragments outside -->
  <g fill="#19a866" fill-opacity="0.2" font-size="11" text-anchor="middle">
    <text x="200" y="300">Build in Africa</text><text x="1080" y="300">for Africa</text>
    <text x="200" y="540">civic voice</text><text x="1080" y="540">agentic delivery</text>
  </g>
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#fff"/><text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text><text x="70" y="68" fill="#fff" font-size="14" font-weight="800">T3raTech</text>
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#fff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">Cursor pulses echoes that briefly reveal hidden text fragments.</text>
  <g transform="translate(640,400)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#fff" stroke="#0a0d0b"/></g>
  <rect x="0" y="794" width="1280" height="26" fill="#111"/><text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 18 — Echo Pulses: cursor pulses reveal hidden text fragments (values/mission/taglines) per section</text>
</svg>
