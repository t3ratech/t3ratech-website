<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>14 — Data Rain with Cursor Umbrella</title>
  <defs><radialGradient id="bg14" cx="50%" cy="40%" r="80%"><stop offset="0%" stop-color="#0a1410"/><stop offset="100%" stop-color="#050807"/></radialGradient></defs>
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · section: Technology (glyphs = tech tags)</text>
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg14)"/>
  <!-- falling glyphs (dim green) -->
  <g fill="#19a866" fill-opacity="0.35" font-family="monospace" font-size="11">
    <text x="120" y="120">Rust</text><text x="120" y="200">gRPC</text><text x="120" y="280">Kafka</text>
    <text x="240" y="160">MCP</text><text x="240" y="240">WASM</text><text x="240" y="340">Redis</text>
    <text x="360" y="100">React</text><text x="360" y="180">Expo</text><text x="360" y="260">Vite</text>
    <text x="480" y="140">Docker</text><text x="480" y="220">Terraform</text>
    <text x="840" y="120">NFTs</text><text x="840" y="200">OpenSea</text><text x="840" y="280">Base</text>
    <text x="960" y="160">A2A</text><text x="960" y="240">SSE</text><text x="960" y="320">JWT</text>
    <text x="1080" y="100">Argon2</text><text x="1080" y="180">RBAC</text><text x="1080" y="260">LanceDB</text>
  </g>
  <!-- cursor bubble at 600,360 resolves glyphs to readable -->
  <circle cx="600" cy="360" r="120" fill="#0e1310" fill-opacity="0.6" stroke="#19a866" stroke-opacity="0.4" stroke-dasharray="3 5"/>
  <g fill="#9be8c4" font-family="monospace" font-size="13" font-weight="700">
    <text x="540" y="320">MCP</text><text x="560" y="350">Rust</text><text x="540" y="380">gRPC</text><text x="560" y="410">Kafka</text>
  </g>
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#fff"/><text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text><text x="70" y="68" fill="#fff" font-size="14" font-weight="800">T3raTech</text>
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#fff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">Falling glyphs resolve into readable terms inside a cursor bubble.</text>
  <g transform="translate(600,360)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#fff" stroke="#0a0d0b"/></g>
  <rect x="0" y="794" width="1280" height="26" fill="#111"/><text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 14 — Data Rain: falling glyphs resolve into readable T3raTech terms inside a cursor bubble</text>
</svg>
