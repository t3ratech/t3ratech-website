<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>09 — Ink in Water</title>
  <defs>
    <radialGradient id="ink9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19a866" stop-opacity="0.7"/><stop offset="60%" stop-color="#19a866" stop-opacity="0.2"/><stop offset="100%" stop-color="#19a866" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg9" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0a0f0d"/><stop offset="100%" stop-color="#050807"/></radialGradient>
  </defs>
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · section: Home (ink resolves to Africa outline)</text>
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg9)"/>
  <!-- ink bloom around cursor at 580,400 -->
  <circle cx="580" cy="400" r="180" fill="url(#ink9)"/>
  <circle cx="580" cy="400" r="120" fill="url(#ink9)" opacity="0.6"/>
  <!-- Africa outline forming inside bloom -->
  <g stroke="#9be8c4" stroke-width="2" fill="none" opacity="0.85">
    <path d="M540 320 Q 580 300 620 320 L 640 360 Q 660 400 640 440 L 600 470 Q 560 480 540 460 L 520 420 Q 510 380 520 350 Z"/>
  </g>
  <text x="580" y="395" fill="#9be8c4" font-size="9" text-anchor="middle" opacity="0.6">AFRICA</text>
  <!-- faint ink tendrils -->
  <g stroke="#19a866" stroke-opacity="0.2" fill="none" stroke-width="1">
    <path d="M580 400 Q 700 380 820 360"/><path d="M580 400 Q 460 420 340 440"/>
    <path d="M580 400 Q 600 520 620 620"/><path d="M580 400 Q 560 280 540 180"/>
  </g>
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#fff"/><text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text><text x="70" y="68" fill="#fff" font-size="14" font-weight="800">T3raTech</text>
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#fff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">Cursor drops ink into dark water; blooms resolve into section imagery.</text>
  <g transform="translate(580,400)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#fff" stroke="#0a0d0b"/></g>
  <rect x="0" y="794" width="1280" height="26" fill="#111"/><text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 9 — Ink in Water: cursor drops ink that resolves into section imagery (Africa / NFT / hex grid)</text>
</svg>
