<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>26 — Combined: Constellation + Project Labels + Hover Robot</title>
  <desc>Base = node constellation (#2). Nodes carry project-name labels (#5). On hover, a sleek sentinel robot (#1/#4 hybrid) appears, eyes track the cursor, one arm points at the hovered node, and its chest core displays the hovered project's name + tagline.</desc>
  <defs>
    <radialGradient id="bg26" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#0c1a14"/><stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <radialGradient id="hotG26" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9be8c4" stop-opacity="0.9"/><stop offset="100%" stop-color="#19a866" stop-opacity="0"/>
    </radialGradient>
    <!-- sleek chrome for the cool robot -->
    <linearGradient id="chrome26" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a423d"/><stop offset="50%" stop-color="#1a201d"/><stop offset="100%" stop-color="#0a0d0b"/>
    </linearGradient>
    <linearGradient id="chromeEdge26" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a625d"/><stop offset="100%" stop-color="#2a302d"/>
    </linearGradient>
    <radialGradient id="visorG26" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a0d0b"/><stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <radialGradient id="eyeG26" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c8f5dc"/><stop offset="55%" stop-color="#19a866"/><stop offset="100%" stop-color="#064a2c"/>
    </radialGradient>
    <radialGradient id="coreG26" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2ad48a"/><stop offset="60%" stop-color="#087a48"/><stop offset="100%" stop-color="#032a1a"/>
    </radialGradient>
    <radialGradient id="hoverG26" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d49a18" stop-opacity="0.6"/><stop offset="100%" stop-color="#d49a18" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow26" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- browser chrome -->
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · hover a node</text>

  <!-- dark background -->
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg26)"/>

  <!-- faint hex grid (subtle, like #2) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 140 L1280 140 M0 220 L1280 220 M0 300 L1280 300 M0 380 L1280 380 M0 460 L1280 460 M0 540 L1280 540 M0 620 L1280 620 M0 700 L1280 700"/>
    <path d="M120 34 L120 820 M260 34 L260 820 M400 34 L400 820 M540 34 L540 820 M680 34 L680 820 M820 34 L820 820 M960 34 L960 820 M1100 34 L1100 820"/>
  </g>

  <!-- constellation edges (dim) -->
  <g stroke="#19a866" stroke-opacity="0.14" stroke-width="1" fill="none">
    <line x1="180" y1="180" x2="340" y2="140"/><line x1="340" y1="140" x2="500" y2="220"/>
    <line x1="500" y1="220" x2="640" y2="180"/><line x1="640" y1="180" x2="800" y2="260"/>
    <line x1="800" y1="260" x2="960" y2="200"/><line x1="960" y1="200" x2="1100" y2="300"/>
    <line x1="180" y1="180" x2="260" y2="340"/><line x1="260" y1="340" x2="420" y2="400"/>
    <line x1="420" y1="400" x2="580" y2="360"/><line x1="580" y1="360" x2="720" y2="440"/>
    <line x1="720" y1="440" x2="880" y2="400"/><line x1="880" y1="400" x2="1040" y2="460"/>
    <line x1="260" y1="340" x2="340" y2="520"/><line x1="340" y1="520" x2="500" y2="580"/>
    <line x1="500" y1="580" x2="660" y2="540"/><line x1="660" y1="540" x2="820" y2="600"/>
    <line x1="820" y1="600" x2="980" y2="560"/><line x1="980" y1="560" x2="1100" y2="640"/>
    <line x1="500" y1="220" x2="580" y2="360"/><line x1="800" y1="260" x2="720" y2="440"/>
    <line x1="960" y1="200" x2="1040" y2="460"/><line x1="640" y1="180" x2="580" y2="360"/>
  </g>

  <!-- nodes (dim) with project-name labels (#5 style: labels on nodes) -->
  <g fill="#19a866" fill-opacity="0.35">
    <circle cx="180" cy="180" r="5"/><circle cx="340" cy="140" r="5"/><circle cx="500" cy="220" r="5"/>
    <circle cx="640" cy="180" r="5"/><circle cx="800" cy="260" r="5"/><circle cx="960" cy="200" r="5"/>
    <circle cx="1100" cy="300" r="5"/><circle cx="260" cy="340" r="5"/><circle cx="420" cy="400" r="5"/>
    <circle cx="580" cy="360" r="5"/><circle cx="720" cy="440" r="5"/><circle cx="880" cy="400" r="5"/>
    <circle cx="1040" cy="460" r="5"/><circle cx="340" cy="520" r="5"/><circle cx="500" cy="580" r="5"/>
    <circle cx="660" cy="540" r="5"/><circle cx="820" cy="600" r="5"/><circle cx="980" cy="560" r="5"/>
    <circle cx="1100" cy="640" r="5"/>
  </g>
  <g fill="#5f655f" font-size="9" text-anchor="middle">
    <text x="180" y="166">SciTech ZW</text>
    <text x="340" y="126">Zim Developers</text>
    <text x="500" y="206">WomenTech ZW</text>
    <text x="640" y="166">T3rnel Browser</text>
    <text x="800" y="246">MCP Bridge</text>
    <text x="960" y="186">Intelligence MCP</text>
    <text x="1100" y="286">Doc Intelligence</text>
    <text x="260" y="326">Agent Skills</text>
    <text x="420" y="386">T3rnel Genesis</text>
    <text x="580" y="346">Gumroad Shop</text>
    <text x="720" y="426">A2A Protocol</text>
    <text x="880" y="386">Agent Swarms</text>
    <text x="1040" y="446">Knowledge Graphs</text>
    <text x="340" y="506">Wakanda Jobs</text>
    <text x="500" y="566">T3raTrade</text>
    <text x="660" y="526">Web3 Squad</text>
    <text x="820" y="586">Gadget Galaxy</text>
    <text x="980" y="546">MotoVerse</text>
    <text x="1100" y="626">Property Portal</text>
  </g>

  <!-- HOVERED NODE: "T3rnel Browser" at 640,180 — lit gold, halo, tooltip -->
  <circle cx="640" cy="180" r="40" fill="url(#hoverG26)"/>
  <circle cx="640" cy="180" r="10" fill="#ffc247" filter="url(#glow26)"/>
  <circle cx="640" cy="180" r="6" fill="#d49a18"/>
  <g fill="#ffc247" font-size="10" text-anchor="middle" font-weight="700">
    <text x="640" y="160">T3rnel Browser</text>
  </g>
  <!-- hover tooltip card -->
  <g transform="translate(440,80)">
    <rect x="0" y="0" width="260" height="64" rx="8" fill="#0e1310" stroke="#d49a18" stroke-opacity="0.6"/>
    <rect x="0" y="0" width="4" height="64" rx="2" fill="#d49a18"/>
    <text x="16" y="22" fill="#ffc247" font-size="11" font-weight="700">T3RNEL BROWSER</text>
    <text x="16" y="40" fill="#cfd6cf" font-size="10">DevTools you can talk to — 102 tools,</text>
    <text x="16" y="54" fill="#a7b1aa" font-size="10">Chrome/Brave/Edge/Firefox, MCP included.</text>
  </g>

  <!-- edges from hovered node light up -->
  <g stroke="#d49a18" stroke-width="1.6" stroke-opacity="0.7" fill="none">
    <line x1="640" y1="180" x2="500" y2="220"/><line x1="640" y1="180" x2="800" y2="260"/>
    <line x1="640" y1="180" x2="580" y2="360"/>
  </g>
  <g fill="#ffc247"><circle cx="500" cy="220" r="6"/><circle cx="800" cy="260" r="6"/><circle cx="580" cy="360" r="6"/></g>

  <!-- ============ THE COOL ROBOT (sleeker than #1, #4 aesthetic) ============ -->
  <!-- positioned bottom-right, fixed. Eyes + arm track cursor at 640,180 (the hovered node). -->
  <g transform="translate(980,460)">
    <!-- ground shadow -->
    <ellipse cx="80" cy="300" rx="90" ry="14" fill="#000" opacity="0.5"/>

    <!-- antenna with glowing tip -->
    <line x1="80" y1="44" x2="80" y2="20" stroke="#3a423d" stroke-width="3"/>
    <circle cx="80" cy="16" r="6" fill="#19a866" filter="url(#glow26)"/>
    <circle cx="80" cy="16" r="3" fill="#c8f5dc"/>

    <!-- head: sleeker, angled visor (not boxy) -->
    <path d="M28 52 L 132 52 L 140 64 L 140 120 L 128 132 L 32 132 L 20 120 L 20 64 Z" fill="url(#chrome26)" stroke="url(#chromeEdge26)" stroke-width="1.5"/>
    <!-- visor strip (dark glass) -->
    <path d="M28 70 L 132 70 L 136 78 L 136 108 L 128 116 L 32 116 L 24 108 L 24 78 Z" fill="url(#visorG26)" stroke="#0a0d0b" stroke-width="1"/>
    <!-- visor edge light -->
    <line x1="28" y1="70" x2="132" y2="70" stroke="#19a866" stroke-opacity="0.5" stroke-width="1"/>

    <!-- EYES: track cursor at (640,180). Robot origin at (980,460). Cursor relative = (-340,-280). Up-left. -->
    <!-- left eye socket -->
    <ellipse cx="56" cy="92" rx="14" ry="10" fill="#050807"/>
    <ellipse cx="100" cy="92" rx="14" ry="10" fill="#050807"/>
    <!-- pupils shifted up-left toward cursor -->
    <circle cx="50" cy="86" r="6" fill="url(#eyeG26)" filter="url(#glow26)"/>
    <circle cx="94" cy="86" r="6" fill="url(#eyeG26)" filter="url(#glow26)"/>
    <!-- pupil highlight -->
    <circle cx="48" cy="84" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="92" cy="84" r="2" fill="#ffffff" opacity="0.9"/>

    <!-- mouth = thin status bar -->
    <rect x="48" y="124" width="64" height="4" rx="2" fill="#050807"/>
    <rect x="48" y="124" width="44" height="4" rx="2" fill="#19a866"/>

    <!-- neck -->
    <rect x="68" y="132" width="24" height="12" fill="url(#chrome26)" stroke="#2a302d" stroke-width="1"/>

    <!-- torso: sleeker, tapered -->
    <path d="M24 144 L 136 144 L 148 160 L 148 250 L 136 266 L 24 266 L 12 250 L 12 160 Z" fill="url(#chrome26)" stroke="url(#chromeEdge26)" stroke-width="1.5"/>
    <!-- torso panel lines -->
    <line x1="12" y1="200" x2="148" y2="200" stroke="#0a0d0b" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="80" y1="144" x2="80" y2="266" stroke="#0a0d0b" stroke-opacity="0.3" stroke-width="1"/>

    <!-- CHEST CORE: shows hovered project info (T3rnel Browser) -->
    <circle cx="80" cy="200" r="34" fill="url(#coreG26)" stroke="#c8f5dc" stroke-width="1.5" filter="url(#glow26)"/>
    <!-- mini browser icon inside core -->
    <g transform="translate(80,200)">
      <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#0a0d0b" opacity="0.6"/>
      <line x1="-14" y1="-4" x2="14" y2="-4" stroke="#9be8c4" stroke-width="1"/>
      <circle cx="-10" cy="-7" r="1.5" fill="#cf2630"/>
      <circle cx="-5" cy="-7" r="1.5" fill="#d49a18"/>
      <circle cx="0" cy="-7" r="1.5" fill="#19a866"/>
    </g>
    <text x="80" y="248" fill="#c8f5dc" font-size="7" text-anchor="middle" letter-spacing="1.5">BROWSER · 102 TOOLS</text>

    <!-- LEFT arm (resting at side) -->
    <path d="M12 160 L 0 165 L 0 240 L 12 245" fill="url(#chrome26)" stroke="#2a302d" stroke-width="1"/>

    <!-- RIGHT arm: POINTING up-left toward cursor at (640,180). Robot at (980,460). Direction = (-340,-280), angle ~ -140°. -->
    <!-- shoulder joint -->
    <circle cx="148" cy="165" r="10" fill="url(#chrome26)" stroke="#3a423d" stroke-width="1.5"/>
    <!-- upper arm pointing up-left -->
    <line x1="148" y1="165" x2="110" y2="120" stroke="url(#chrome26)" stroke-width="16" stroke-linecap="round"/>
    <!-- elbow joint -->
    <circle cx="110" cy="120" r="8" fill="url(#chrome26)" stroke="#3a423d" stroke-width="1.5"/>
    <!-- forearm continuing up-left toward cursor -->
    <line x1="110" y1="120" x2="78" y2="78" stroke="url(#chrome26)" stroke-width="13" stroke-linecap="round"/>
    <!-- hand -->
    <circle cx="76" cy="76" r="9" fill="url(#chromeEdge26)" stroke="#3a423d" stroke-width="1.5"/>
    <!-- pointing finger (extended toward cursor) -->
    <line x1="72" y1="72" x2="56" y2="56" stroke="#cfd6cf" stroke-width="5" stroke-linecap="round"/>
    <circle cx="55" cy="55" r="3" fill="#9be8c4" filter="url(#glow26)"/>

    <!-- legs -->
    <path d="M40 266 L 36 300 L 44 300 L 52 266" fill="url(#chrome26)" stroke="#2a302d" stroke-width="1"/>
    <path d="M108 266 L 116 266 L 124 300 L 116 300 Z" fill="url(#chrome26)" stroke="#2a302d" stroke-width="1"/>
    <path d="M68 266 L 92 266 L 96 300 L 64 300 Z" fill="url(#chrome26)" stroke="#2a302d" stroke-width="1"/>
    <!-- feet -->
    <ellipse cx="40" cy="302" rx="14" ry="6" fill="#0a0d0b"/>
    <ellipse cx="80" cy="302" rx="14" ry="6" fill="#0a0d0b"/>
    <ellipse cx="120" cy="302" rx="14" ry="6" fill="#0a0d0b"/>
  </g>

  <!-- dashed sight-line from robot finger tip to hovered node (shows tracking) -->
  <line x1="1035" y1="515" x2="640" y2="180" stroke="#d49a18" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="4 6"/>

  <!-- header -->
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.84"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#ffffff"/>
  <text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text>
  <text x="70" y="68" fill="#ffffff" font-size="14" font-weight="800">T3raTech</text>
  <g fill="#cfd6cf" font-size="12">
    <text x="760" y="68">Home</text><text x="820" y="68">Products ▾</text><text x="920" y="68">Skills</text><text x="980" y="68">NFTs</text><text x="1030" y="68">Gumroad</text><text x="1110" y="68">WhatsApp</text>
  </g>
  <circle cx="1200" cy="62" r="9" fill="none" stroke="#cfd6cf" stroke-width="1.5"/>

  <!-- hero text (kept subtle so constellation + robot dominate) -->
  <text x="80" y="430" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="478" fill="#ffffff" font-size="36" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="510" fill="#a7b1aa" font-size="13">Hover any node — the sentinel tracks, points, and shows you what's there.</text>

  <!-- cursor on the hovered node -->
  <g transform="translate(640,180)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#ffffff" stroke="#0a0d0b" stroke-width="1"/></g>
  <text x="656" y="178" fill="#ffc247" font-size="9">hover</text>

  <!-- caption -->
  <rect x="0" y="794" width="1280" height="26" fill="#111111"/>
  <text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 26 — Combined: project-name constellation (#2) + labels (#5) + hover robot sentinel (#1/#4) tracking &amp; pointing at the hovered node</text>
</svg>
