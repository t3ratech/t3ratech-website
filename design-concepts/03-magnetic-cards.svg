<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>Concept 3 — Magnetic Agentic Pull</title>
  <desc>Existing technology/explore cards tilt toward the cursor with a soft glow that follows the mouse. A lighter, premium-SaaS feel that elevates the current card layout.</desc>
  <defs>
    <radialGradient id="glowG3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19a866" stop-opacity="0.35"/><stop offset="100%" stop-color="#19a866" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardG3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f7f4"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw  ·  section: Technology</text>

  <!-- page (cream) -->
  <rect x="0" y="34" width="1280" height="786" fill="#f7f8f5"/>

  <!-- header -->
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.84"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#ffffff"/>
  <text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text>
  <text x="70" y="68" fill="#ffffff" font-size="14" font-weight="800">T3raTech</text>
  <g fill="#cfd6cf" font-size="12"><text x="900" y="68">Products ▾</text><text x="1000" y="68">Skills</text><text x="1060" y="68">NFTs</text></g>

  <!-- section heading -->
  <text x="80" y="130" fill="#5f655f" font-size="11" letter-spacing="2">BLEEDING-EDGE, PRACTICAL ENGINEERING</text>
  <text x="80" y="166" fill="#171717" font-size="22" font-weight="700">Advanced technology is useful only when it makes real</text>
  <text x="80" y="192" fill="#171717" font-size="22" font-weight="700">systems safer, faster, and clearer.</text>

  <!-- tech tags -->
  <g font-size="10" fill="#263026">
    <rect x="80" y="214" width="44" height="22" rx="11" fill="#eef3ef"/><text x="102" y="229" text-anchor="middle">NFTs</text>
    <rect x="130" y="214" width="120" height="22" rx="11" fill="#eef3ef"/><text x="190" y="229" text-anchor="middle">MCP Session Bridge</text>
    <rect x="256" y="214" width="92" height="22" rx="11" fill="#eef3ef"/><text x="302" y="229" text-anchor="middle">T3rnel Browser</text>
    <rect x="354" y="214" width="110" height="22" rx="11" fill="#eef3ef"/><text x="409" y="229" text-anchor="middle">Agent swarms</text>
    <rect x="470" y="214" width="80" height="22" rx="11" fill="#eef3ef"/><text x="510" y="229" text-anchor="middle">Rust kernels</text>
  </g>

  <!-- cursor-following glow (behind cards) -->
  <circle cx="540" cy="470" r="220" fill="url(#glowG3)"/>

  <!-- technology cards (3x2). The card nearest cursor (center) is tilted toward it + lit. -->
  <g transform="translate(80,260)">
    <!-- row 1 -->
    <g transform="translate(0,0) rotate(-2 180 90)">
      <rect width="360" height="170" rx="12" fill="url(#cardG3)" stroke="#d8ddd4"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <path d="M27 30 h20 v14 h-12 l-4 4 v-4 h-4 z" fill="none" stroke="#087a48" stroke-width="2"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">NFTs &amp; digital collectibles</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">T3rnel Genesis on OpenSea — agent-</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">generated artwork minted on Base.</text>
    </g>
    <!-- CENTER card: nearest cursor, tilted toward (540,470) -> rotate +3, lifted, green border -->
    <g transform="translate(380,-8) rotate(3 180 95)">
      <rect width="360" height="170" rx="12" fill="#ffffff" stroke="#19a866" stroke-width="2"/>
      <rect x="0" y="0" width="360" height="170" rx="12" fill="url(#glowG3)" opacity="0.5"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <circle cx="37" cy="37" r="8" fill="none" stroke="#087a48" stroke-width="2"/>
      <path d="M30 40 h14 M37 33 v8" stroke="#087a48" stroke-width="2"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">MCP servers</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">MCP Session Bridge exposes 103 browser</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">tools over stdio with an approval gate.</text>
      <rect x="20" y="120" width="90" height="26" rx="13" fill="#19a866"/><text x="65" y="137" fill="#fff" font-size="10" text-anchor="middle">Learn more →</text>
    </g>
    <g transform="translate(760,0) rotate(-1 180 90)">
      <rect width="360" height="170" rx="12" fill="url(#cardG3)" stroke="#d8ddd4"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <rect x="27" y="29" width="20" height="14" rx="2" fill="none" stroke="#087a48" stroke-width="2"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">Browser automation</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">T3rnel Browser — 102 tools, any tab as an</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">agentic surface for any MCP client.</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0,190) rotate(1 180 90)">
      <rect width="360" height="170" rx="12" fill="url(#cardG3)" stroke="#d8ddd4"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <path d="M30 37 q7 -10 14 0 q7 10 0 0" fill="none" stroke="#087a48" stroke-width="2"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">Agentic systems</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">Agent swarms, A2A coordination, MCP,</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">memory, and human approval loops.</text>
    </g>
    <g transform="translate(380,190) rotate(-2 180 90)">
      <rect width="360" height="170" rx="12" fill="url(#cardG3)" stroke="#d8ddd4"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <circle cx="37" cy="37" r="9" fill="none" stroke="#087a48" stroke-width="2"/>
      <circle cx="37" cy="37" r="3" fill="#087a48"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">T3rnel Intelligence MCP</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">Evidence-backed lead research, scoring,</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">and reporting through an MCP server.</text>
    </g>
    <g transform="translate(760,190) rotate(2 180 90)">
      <rect width="360" height="170" rx="12" fill="url(#cardG3)" stroke="#d8ddd4"/>
      <rect x="20" y="20" width="34" height="34" rx="8" fill="#eef3ef"/>
      <path d="M27 30 h20 v18 h-8 l-4 4 v-4 h-8 z" fill="none" stroke="#087a48" stroke-width="2"/>
      <text x="64" y="40" fill="#171717" font-size="14" font-weight="700">Document Intelligence</text>
      <text x="20" y="74" fill="#5f655f" font-size="11">Receipt &amp; invoice extraction with R2</text>
      <text x="20" y="90" fill="#5f655f" font-size="11">storage, D1 quota, usage dashboard.</text>
    </g>
  </g>

  <!-- cursor -->
  <g transform="translate(540,470)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#ffffff" stroke="#0a0d0b" stroke-width="1"/></g>

  <rect x="0" y="794" width="1280" height="26" fill="#111111"/>
  <text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 3 — Magnetic Agentic Pull: cards tilt toward the cursor; a soft glow follows the mouse across the grid</text>
</svg>
