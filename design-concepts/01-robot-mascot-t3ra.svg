<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>Concept 1 — T3ra the Sentinel Robot Mascot</title>
  <desc>Fixed background robot whose eyes track the cursor, chest display shows the current section icon, and one hand points at the cursor.</desc>
  <defs>
    <radialGradient id="heroG1" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a2a22"/><stop offset="100%" stop-color="#070a08"/>
    </radialGradient>
    <linearGradient id="chrome1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f2c"/><stop offset="100%" stop-color="#0e1310"/>
    </linearGradient>
    <radialGradient id="coreG1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#19a866"/><stop offset="60%" stop-color="#087a48"/><stop offset="100%" stop-color="#043b24"/>
    </radialGradient>
    <radialGradient id="eyeG1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9be8c4"/><stop offset="70%" stop-color="#19a866"/><stop offset="100%" stop-color="#064a2c"/>
    </radialGradient>
  </defs>

  <!-- browser chrome -->
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw</text>

  <!-- hero section (dark) -->
  <rect x="0" y="34" width="1280" height="520" fill="url(#heroG1)"/>
  <!-- faint hex grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 120 L1280 120 M0 200 L1280 200 M0 280 L1280 280 M0 360 L1280 360 M0 440 L1280 440"/>
    <path d="M120 34 L120 554 M240 34 L240 554 M360 34 L360 554 M480 34 L480 554 M600 34 L600 554 M720 34 L720 554 M840 34 L840 554 M960 34 L960 554 M1080 34 L1080 554 M1200 34 L1200 554"/>
  </g>

  <!-- header -->
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.84"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#ffffff"/>
  <text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text>
  <text x="70" y="68" fill="#ffffff" font-size="14" font-weight="800">T3raTech</text>
  <g fill="#cfd6cf" font-size="12">
    <text x="760" y="68">Home</text><text x="820" y="68">Products ▾</text><text x="920" y="68">Skills</text><text x="980" y="68">NFTs</text><text x="1030" y="68">Gumroad</text><text x="1110" y="68">WhatsApp</text>
  </g>
  <circle cx="1200" cy="62" r="9" fill="none" stroke="#cfd6cf" stroke-width="1.5"/>

  <!-- hero text -->
  <text x="80" y="200" fill="#19a866" font-size="13" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="262" fill="#ffffff" font-size="46" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="312" fill="#cfd6cf" font-size="15">A proudly Zimbabwean software company building</text>
  <text x="80" y="334" fill="#cfd6cf" font-size="15">digital systems for civic voice, agentic delivery,</text>
  <text x="80" y="356" fill="#cfd6cf" font-size="15">and connected technology communities.</text>
  <rect x="80" y="386" width="170" height="42" rx="21" fill="#19a866"/>
  <text x="165" y="412" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Explore products →</text>

  <!-- THE ROBOT MASCOT (fixed, right side) -->
  <g transform="translate(960,150)">
    <!-- pointing arm toward cursor (cursor at 1180,300) -->
    <g>
      <line x1="60" y1="180" x2="220" y2="150" stroke="url(#chrome1)" stroke-width="22" stroke-linecap="round"/>
      <circle cx="225" cy="149" r="14" fill="url(#chrome1)" stroke="#3a423d" stroke-width="2"/>
      <!-- finger -->
      <line x1="225" y1="149" x2="252" y2="142" stroke="#cfd6cf" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- head -->
    <rect x="20" y="40" width="120" height="100" rx="22" fill="url(#chrome1)" stroke="#3a423d" stroke-width="2"/>
    <rect x="70" y="28" width="20" height="18" rx="6" fill="#3a423d"/>
    <circle cx="80" cy="26" r="5" fill="#19a866"/>
    <!-- eyes (pupils offset toward cursor at 1180,300 -> dir +x,+y slightly) -->
    <circle cx="52" cy="86" r="16" fill="#0a0d0b"/>
    <circle cx="108" cy="86" r="16" fill="#0a0d0b"/>
    <circle cx="58" cy="92" r="7" fill="url(#eyeG1)"/>
    <circle cx="114" cy="92" r="7" fill="url(#eyeG1)"/>
    <!-- mouth = status bar -->
    <rect x="44" y="116" width="72" height="8" rx="4" fill="#0a0d0b"/>
    <rect x="44" y="116" width="48" height="8" rx="4" fill="#19a866"/>
    <!-- body -->
    <rect x="10" y="150" width="140" height="150" rx="20" fill="url(#chrome1)" stroke="#3a423d" stroke-width="2"/>
    <!-- chest core display: shows CURRENT SECTION icon = community chat bubble -->
    <circle cx="80" cy="220" r="42" fill="url(#coreG1)" stroke="#9be8c4" stroke-width="2"/>
    <!-- chat bubble icon -->
    <path d="M62 208 h24 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-12 l-6 6 v-6 h-6 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 z" fill="#ffffff" opacity="0.95"/>
    <text x="80" y="285" fill="#9be8c4" font-size="9" text-anchor="middle" letter-spacing="2">SECTION: COMMUNITY</text>
    <!-- legs -->
    <rect x="34" y="300" width="34" height="60" rx="10" fill="url(#chrome1)"/>
    <rect x="92" y="300" width="34" height="60" rx="10" fill="url(#chrome1)"/>
  </g>

  <!-- cursor -->
  <g transform="translate(1180,300)">
    <path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#ffffff" stroke="#0a0d0b" stroke-width="1"/>
  </g>
  <text x="1192" y="296" fill="#19a866" font-size="10">cursor</text>

  <!-- section indicator chips (left, showing section-aware core states) -->
  <g transform="translate(80,470)" font-size="9">
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#19a866"/><text x="43" y="15" fill="#fff" text-anchor="middle" font-weight="700">COMMUNITY</text>
    <rect x="94" y="0" width="70" height="22" rx="11" fill="#0e1310" stroke="#3a423d"/><text x="129" y="15" fill="#a7b1aa" text-anchor="middle">PRODUCTS</text>
    <rect x="172" y="0" width="78" height="22" rx="11" fill="#0e1310" stroke="#3a423d"/><text x="211" y="15" fill="#a7b1aa" text-anchor="middle">AGENT TOOLS</text>
    <rect x="258" y="0" width="80" height="22" rx="11" fill="#0e1310" stroke="#3a423d"/><text x="298" y="15" fill="#a7b1aa" text-anchor="middle">TECHNOLOGY</text>
  </g>

  <!-- content section peek (cream) -->
  <rect x="0" y="554" width="1280" height="266" fill="#f7f8f5"/>
  <text x="80" y="600" fill="#5f655f" font-size="11" letter-spacing="2">AFRICAN PROBLEM-SOLVING</text>
  <text x="80" y="636" fill="#171717" font-size="22" font-weight="700">Software that meets people where the work already happens.</text>
  <g transform="translate(80,666)">
    <rect x="0" y="0" width="360" height="120" rx="10" fill="#ffffff" stroke="#d8ddd4"/>
    <rect x="0" y="0" width="6" height="120" rx="3" fill="#19a866"/>
    <text x="22" y="28" fill="#087a48" font-size="10" font-weight="700">COMMUNITY</text>
    <text x="22" y="56" fill="#171717" font-size="13" font-weight="700">SciTech Zimbabwe keeps builders connected.</text>
    <text x="22" y="80" fill="#5f655f" font-size="11">A national WhatsApp network for science, tech,</text>
    <text x="22" y="96" fill="#5f655f" font-size="11">property, gaming, events, and market discussion.</text>
  </g>

  <!-- caption -->
  <rect x="0" y="794" width="1280" height="26" fill="#111111"/>
  <text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 1 — T3ra the Sentinel: eyes + finger track cursor; chest core shows the section you're reading</text>
</svg>
