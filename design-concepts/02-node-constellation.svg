<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>Concept 2 — African Node Constellation</title>
  <desc>A fixed background knowledge graph of community/agent nodes. Nodes near the cursor light up and connecting lines pulse; the constellation re-organizes per section.</desc>
  <defs>
    <radialGradient id="bgG2" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0c1a14"/><stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <radialGradient id="hotG2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9be8c4" stop-opacity="0.9"/><stop offset="100%" stop-color="#19a866" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw  ·  section: Products</text>

  <!-- fixed background constellation -->
  <rect x="0" y="34" width="1280" height="786" fill="url(#bgG2)"/>

  <!-- edges -->
  <g stroke="#19a866" stroke-opacity="0.18" stroke-width="1">
    <line x1="180" y1="160" x2="320" y2="120"/><line x1="320" y1="120" x2="460" y2="200"/>
    <line x1="460" y1="200" x2="540" y2="340"/><line x1="540" y1="340" x2="380" y2="420"/>
    <line x1="380" y1="420" x2="220" y2="380"/><line x1="220" y1="380" x2="180" y2="160"/>
    <line x1="540" y1="340" x2="700" y2="280"/><line x1="700" y1="280" x2="860" y2="360"/>
    <line x1="860" y1="360" x2="980" y2="240"/><line x1="980" y1="240" x2="1080" y2="380"/>
    <line x1="860" y1="360" x2="900" y2="520"/><line x1="900" y1="520" x2="760" y2="600"/>
    <line x1="760" y1="600" x2="600" y2="560"/><line x1="600" y1="560" x2="540" y2="340"/>
    <line x1="760" y1="600" x2="980" y2="640"/><line x1="980" y1="640" x2="1080" y2="380"/>
    <line x1="380" y1="420" x2="500" y2="560"/><line x1="500" y1="560" x2="600" y2="560"/>
    <line x1="320" y1="120" x2="700" y2="280"/><line x1="460" y1="200" x2="860" y2="360"/>
  </g>
  <!-- hot edges near cursor (820,300) -->
  <g stroke="#19a866" stroke-width="1.6" stroke-opacity="0.85">
    <line x1="700" y1="280" x2="860" y2="360"/><line x1="860" y1="360" x2="980" y2="240"/>
    <line x1="860" y1="360" x2="900" y2="520"/>
  </g>

  <!-- nodes (dim) -->
  <g fill="#19a866" fill-opacity="0.35">
    <circle cx="180" cy="160" r="5"/><circle cx="320" cy="120" r="5"/><circle cx="460" cy="200" r="5"/>
    <circle cx="540" cy="340" r="5"/><circle cx="380" cy="420" r="5"/><circle cx="220" cy="380" r="5"/>
    <circle cx="600" cy="560" r="5"/><circle cx="500" cy="560" r="5"/><circle cx="760" cy="600" r="5"/>
    <circle cx="980" cy="640" r="5"/><circle cx="900" cy="520" r="5"/><circle cx="980" cy="240" r="5"/>
  </g>
  <!-- hot nodes near cursor -->
  <g>
    <circle cx="700" cy="280" r="22" fill="url(#hotG2)"/><circle cx="700" cy="280" r="6" fill="#9be8c4"/>
    <circle cx="860" cy="360" r="28" fill="url(#hotG2)"/><circle cx="860" cy="360" r="8" fill="#9be8c4"/>
    <circle cx="980" cy="240" r="20" fill="url(#hotG2)"/><circle cx="980" cy="240" r="6" fill="#9be8c4"/>
  </g>
  <!-- node labels (section = products, so product nodes are labeled) -->
  <g fill="#cfd6cf" font-size="9">
    <text x="700" y="266" text-anchor="middle">MCP Bridge</text>
    <text x="860" y="346" text-anchor="middle" font-weight="700" fill="#9be8c4">T3rnel Browser</text>
    <text x="980" y="226" text-anchor="middle">Intelligence</text>
  </g>

  <!-- header -->
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#ffffff"/>
  <text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text>
  <text x="70" y="68" fill="#ffffff" font-size="14" font-weight="800">T3raTech</text>
  <g fill="#cfd6cf" font-size="12"><text x="760" y="68">Home</text><text x="820" y="68" fill="#9be8c4">Products ▾</text><text x="920" y="68">Skills</text><text x="980" y="68">NFTs</text></g>

  <!-- hero text overlay (translucent so constellation shows through) -->
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#ffffff" font-size="40" font-weight="800" opacity="0.92">T3raTech Solutions</text>
  <text x="80" y="272" fill="#cfd6cf" font-size="14" opacity="0.8">Agentic software, connected communities, African realities.</text>

  <!-- product cards (foreground, glassy) -->
  <g transform="translate(80,440)">
    <rect x="0" y="0" width="360" height="150" rx="12" fill="#0e1310" fill-opacity="0.78" stroke="#19a866" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#9be8c4" font-size="11" font-weight="700">MCP SESSION BRIDGE</text>
    <text x="20" y="58" fill="#ffffff" font-size="15" font-weight="700">Authenticated browser extraction</text>
    <text x="20" y="84" fill="#a7b1aa" font-size="11">103 browser tools over stdio, with a</text>
    <text x="20" y="100" fill="#a7b1aa" font-size="11">human approval gate.</text>
    <rect x="20" y="116" width="120" height="22" rx="11" fill="#19a866"/><text x="80" y="131" fill="#fff" font-size="10" text-anchor="middle">npm install</text>
  </g>
  <g transform="translate(460,440)">
    <rect x="0" y="0" width="360" height="150" rx="12" fill="#0e1310" fill-opacity="0.78" stroke="#d49a18" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#ffc247" font-size="11" font-weight="700">T3RNEL BROWSER</text>
    <text x="20" y="58" fill="#ffffff" font-size="15" font-weight="700">DevTools you can talk to</text>
    <text x="20" y="84" fill="#a7b1aa" font-size="11">102 tools, Chrome/Brave/Edge/Firefox,</text>
    <text x="20" y="100" fill="#a7b1aa" font-size="11">MCP Session Bridge included.</text>
  </g>

  <!-- cursor + influence ring -->
  <circle cx="820" cy="300" r="90" fill="none" stroke="#19a866" stroke-opacity="0.35" stroke-dasharray="4 6"/>
  <circle cx="820" cy="300" r="130" fill="none" stroke="#19a866" stroke-opacity="0.15"/>
  <g transform="translate(820,300)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#ffffff" stroke="#0a0d0b" stroke-width="1"/></g>

  <rect x="0" y="794" width="1280" height="26" fill="#111111"/>
  <text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 2 — Node Constellation: graph of community/agent nodes lights up around the cursor; re-organizes per section</text>
</svg>
