<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>25 — Wireframe Topology Morph</title>
  <defs><radialGradient id="bg25" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0a1410"/><stop offset="100%" stop-color="#050807"/></radialGradient></defs>
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · section: Products (cube wireframe)</text>
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg25)"/>
  <!-- 3D cube wireframe (isometric) centered, cursor at 760,380 rotates view -->
  <g stroke="#19a866" stroke-opacity="0.7" fill="none" stroke-width="1.5" transform="translate(640,420) rotate(-15) skewX(-10)">
    <!-- front face -->
    <path d="M-120 -100 L 120 -100 L 120 100 L -120 100 Z"/>
    <!-- back face (offset) -->
    <path d="M-80 -140 L 160 -140 L 160 60 L -80 60 Z"/>
    <!-- connecting edges -->
    <line x1="-120" y1="-100" x2="-80" y2="-140"/>
    <line x1="120" y1="-100" x2="160" y2="-140"/>
    <line x1="120" y1="100" x2="160" y2="60"/>
    <line x1="-120" y1="100" x2="-80" y2="60"/>
  </g>
  <!-- vertices lit -->
  <g fill="#9be8c4" transform="translate(640,420) rotate(-15) skewX(-10)">
    <circle cx="-120" cy="-100" r="4"/><circle cx="120" cy="-100" r="4"/>
    <circle cx="120" cy="100" r="4"/><circle cx="-120" cy="100" r="4"/>
    <circle cx="-80" cy="-140" r="4"/><circle cx="160" cy="-140" r="4"/>
    <circle cx="160" cy="60" r="4"/><circle cx="-80" cy="60" r="4"/>
  </g>
  <!-- section shape indicator -->
  <g fill="#a7b1aa" font-size="9" text-anchor="middle">
    <text x="640" y="620">CUBE · PRODUCTS</text>
    <text x="640" y="640" fill="#5f655f">section shapes: sphere(community) · cube(products) · torus(agent) · icosa(nfts)</text>
  </g>
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#fff"/><text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text><text x="70" y="68" fill="#fff" font-size="14" font-weight="800">T3raTech</text>
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#fff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">A 3D wireframe rotates with the cursor; shape morphs per section.</text>
  <g transform="translate(760,380)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#fff" stroke="#0a0d0b"/></g>
  <rect x="0" y="794" width="1280" height="26" fill="#111"/><text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 25 — Wireframe Topology Morph: 3D wireframe rotates with cursor; shape morphs per section</text>
</svg>
