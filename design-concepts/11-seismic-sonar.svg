<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="Inter, system-ui, sans-serif">
  <title>11 — Seismic Sonar Scan</title>
  <defs><radialGradient id="bg11" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0a0f0d"/><stop offset="100%" stop-color="#050807"/></radialGradient></defs>
  <rect width="1280" height="820" fill="#0a0d0b"/>
  <rect x="0" y="0" width="1280" height="34" fill="#1b201d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/><circle cx="60" cy="17" r="5" fill="#28c840"/>
  <rect x="120" y="9" width="1040" height="16" rx="8" fill="#0a0d0b"/>
  <text x="640" y="21" fill="#6b756e" font-size="10" text-anchor="middle">t3ratech.co.zw · section: Technology (topographic map scanned)</text>
  <rect x="0" y="34" width="1280" height="786" fill="url(#bg11)"/>
  <!-- hidden topographic contour lines (dim) -->
  <g stroke="#19a866" stroke-opacity="0.12" fill="none" stroke-width="1">
    <path d="M100 300 Q 400 200 700 320 T 1200 300"/>
    <path d="M100 360 Q 400 260 700 380 T 1200 360"/>
    <path d="M100 420 Q 400 320 700 440 T 1200 420"/>
    <path d="M100 480 Q 400 380 700 500 T 1200 480"/>
    <path d="M100 540 Q 400 440 700 560 T 1200 540"/>
  </g>
  <!-- sonar rings from cursor at 600,400 -->
  <g fill="none" stroke="#19a866">
    <circle cx="600" cy="400" r="60" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="600" cy="400" r="110" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="600" cy="400" r="170" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="600" cy="400" r="230" stroke-opacity="0.1" stroke-width="1"/>
  </g>
  <!-- revealed (brighter) contours inside inner ring -->
  <g stroke="#9be8c4" stroke-opacity="0.8" fill="none" stroke-width="1.5">
    <path d="M540 380 Q 580 360 620 380 Q 660 400 640 430 Q 600 450 560 430 Q 530 410 540 380 Z"/>
  </g>
  <text x="600" y="404" fill="#9be8c4" font-size="9" text-anchor="middle">PEAK: MCP</text>
  <rect x="0" y="34" width="1280" height="56" fill="#050505" fill-opacity="0.7"/>
  <rect x="32" y="48" width="28" height="28" rx="6" fill="#fff"/><text x="46" y="68" fill="#087a48" font-size="16" font-weight="800" text-anchor="middle">T3</text><text x="70" y="68" fill="#fff" font-size="14" font-weight="800">T3raTech</text>
  <text x="80" y="180" fill="#19a866" font-size="12" letter-spacing="3">BUILD IN AFRICA, FOR AFRICA</text>
  <text x="78" y="232" fill="#fff" font-size="40" font-weight="800">T3raTech Solutions</text>
  <text x="80" y="272" fill="#a7b1aa" font-size="14">Cursor emits sonar that scans a hidden topographic system map.</text>
  <g transform="translate(600,400)"><path d="M0 0 L0 18 L5 13 L9 22 L13 20 L9 11 L16 11 Z" fill="#fff" stroke="#0a0d0b"/></g>
  <rect x="0" y="794" width="1280" height="26" fill="#111"/><text x="640" y="811" fill="#9be8c4" font-size="11" text-anchor="middle">CONCEPT 11 — Seismic Sonar Scan: cursor emits expanding rings that reveal a hidden topographic system map</text>
</svg>
