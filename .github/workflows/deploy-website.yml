name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "Dockerfile"
      - "index.html"
      - "nginx.conf.template"
      - "package-lock.json"
      - "package.json"
      - "public/**"
      - "scripts/deploy-website-terraform.sh"
      - "src/**"
      - "infra/website/**"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:
    inputs:
      apply_domain_mappings:
        description: "Apply Cloud Run domain mappings after domain verification"
        required: false
        type: boolean
        default: false
      replace_domain_mappings:
        description: "Force recreate Cloud Run domain mappings"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: t3ratech-website-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 't3ratech-solutions' }}
  REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE_NAME: ${{ vars.WEBSITE_SERVICE_NAME || 't3ratech-website' }}
  REPOSITORY_ID: ${{ vars.ARTIFACT_REPOSITORY_ID || 't3ratech-apps' }}
  DOMAINS_JSON: ${{ vars.WEBSITE_DOMAINS_JSON || '["t3ratech.co.zw","www.t3ratech.co.zw"]' }}
  TF_DIR: infra/website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" || { echo "Set repository variable GCP_WORKLOAD_IDENTITY_PROVIDER."; exit 1; }
          test -n "${GCP_SERVICE_ACCOUNT}" || { echo "Set repository variable GCP_SERVICE_ACCOUNT."; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Deploy website
        env:
          IMAGE_TAG: ${{ github.sha }}
          SKIP_DOMAIN_MAPPINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_domain_mappings && '0' || '1' }}
          REPLACE_DOMAIN_MAPPINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_domain_mappings && '1' || '0' }}
        run: bash scripts/deploy-website-terraform.sh
